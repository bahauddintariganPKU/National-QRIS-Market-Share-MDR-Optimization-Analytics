<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisis Kompetitor QRIS Nasional Lengkap dengan BRI & Flip</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #020417;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .widget-container {
            width: 100%;
            max-width: 750px;
            background: #020417;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Kunci Kategori Atas */
        .category-key {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            font-size: 13px;
            color: #a0aec0;
            flex-wrap: wrap;
        }

        .key-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        /* Area Diagram Orbit */
        .diagram-area {
            position: relative;
            width: 100%;
            height: 460px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        /* Lingkaran Pusat */
        .center-node {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, #e53e3e 0%, #742a2a 100%);
            border: 2px solid #fc8181;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            z-index: 10;
            box-shadow: 0 0 30px rgba(229, 62, 62, 0.4);
        }

        .center-node span {
            font-size: 11px;
            font-weight: normal;
            opacity: 0.8;
            margin-top: 4px;
        }

        /* Node Kompetitor (Mengorbit) */
        .competitor-node {
            position: absolute;
            width: 82px;
            height: 82px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            border: 2px solid transparent;
            opacity: 0.4;
        }

        .competitor-node.active {
            opacity: 1 !important;
            transform: translate(-50%, -50%) scale(1.15) !important;
            box-shadow: 0 0 25px currentColor;
        }

        .competitor-node:hover {
            opacity: 0.8;
        }

        .comp-name {
            font-size: 11px;
            font-weight: bold;
        }

        .comp-share {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 2px;
        }

        /* Panel Statistik Bawah */
        .stats-panel {
            display: flex;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stat-label {
            font-size: 12px;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #3182ce;
            transition: color 0.3s ease;
        }

        /* Kode Warna Kategori */
        .bank { background: rgba(49, 130, 206, 0.2); border-color: #3182ce; color: #63b3ed; }
        .wallet { background: rgba(49, 151, 149, 0.2); border-color: #319795; color: #4fd1c5; }
        .fintech { background: rgba(128, 90, 213, 0.2); border-color: #805ad5; color: #b794f7; }
        .gopay-style { background: rgba(56, 161, 105, 0.2); border-color: #38a169; color: #48bb78; }
        .bri-style { background: rgba(221, 107, 32, 0.2); border-color: #dd6b20; color: #f6ad55; }
    </style>
</head>
<body>

<div class="widget-container">
    <!-- Kunci Kategori -->
    <div class="category-key">
        <div class="key-item"><div class="dot" style="background: #3182ce;"></div> Traditional Banks</div>
        <div class="key-item"><div class="dot" style="background: #38a169;"></div> GoPay Ecosystem</div>
        <div class="key-item"><div class="dot" style="background: #319795;"></div> Other e-Wallets</div>
        <div class="key-item"><div class="dot" style="background: #805ad5;"></div> FinTech & SaaS</div>
    </div>

    <!-- Area Orbit Diagram -->
    <div class="diagram-area" id="diagramArea">
        <div class="center-node">
            QRIS NASIONAL
            <span>Bank Indonesia</span>
        </div>
    </div>

    <!-- Panel Informasi Dinamis -->
    <div class="stats-panel">
        <div class="stat-item">
            <div class="stat-label">Standard MDR</div>
            <div class="stat-value" id="mdrValue">0.3%</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">Settlement Speed</div>
            <div class="stat-value" id="settlementValue">Instant</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">Preference Share</div>
            <div class="stat-value" id="shareValue">15%</div>
        </div>
    </div>
</div>

<script>
    // Data Kompetitor setelah masuknya BRI & Flip (Total 9 elemen)
    const competitors = [
        { name: 'BCA', share: '22%', type: 'bank', mdr: '0.3%', speed: 'Instant (24/7)', colorClass: 'bank' },
        { name: 'GoPay', share: '20%', type: 'wallet', mdr: '0.3%', speed: 'Instant (Real-Time)', colorClass: 'gopay-style' },
        { name: 'DANA', share: '18%', type: 'wallet', mdr: '0.3%', speed: 'Instant s.d H+1', colorClass: 'wallet' },
        { name: 'BRI', share: '15%', type: 'bank', mdr: '0.3%', speed: 'Instant (via App)', colorClass: 'bri-style' },
        { name: 'Mandiri', share: '12%', type: 'bank', mdr: '0.3%', speed: 'Instant (3x Daily)', colorClass: 'bank' },
        { name: 'OVO', share: '8%', type: 'wallet', mdr: '0.3%', speed: 'Next Day (H+1)', colorClass: 'wallet' },
        { name: 'ShopeePay', share: '3%', type: 'wallet', mdr: '0.3%', speed: 'Next Day (H+1)', colorClass: 'wallet' },
        { name: 'Flip', share: '2%', type: 'fintech', mdr: '0.3%', speed: 'Instant s.d H+1', colorClass: 'fintech' },
        { name: 'LinkAja', share: '2%', type: 'wallet', mdr: '0.3%', speed: 'Next Day (H+1)', colorClass: 'wallet' }
    ];

    const diagramArea = document.getElementById('diagramArea');
    const radius = 165; 

    // Kalkulasi posisi orbit melingkar otomatis untuk 9 elemen
    competitors.forEach((comp, index) => {
        const angle = (index * 2 * Math.PI) / competitors.length - (Math.PI / 2);
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;

        const node = document.createElement('div');
        node.className = `competitor-node ${comp.colorClass}`;
        node.style.left = `calc(50% + ${x}px)`;
        node.style.top = `calc(50% + ${y}px)`;
        node.style.transform = 'translate(-50%, -50%)';
        
        node.innerHTML = `
            <div class="comp-name">${comp.name}</div>
            <div class="comp-share">${comp.share}</div>
        `;

        // Default fokus awal otomatis diarahkan ke BRI (Index ke-3)
        if(index === 3) {
            node.classList.add('active');
            // Set data default pada panel bawah sesuai BRI saat pertama load
            setTimeout(() => {
                document.getElementById('mdrValue').innerText = comp.mdr;
                document.getElementById('settlementValue').innerText = comp.speed;
                document.getElementById('shareValue').innerText = comp.share;
                const currentColor = window.getComputedStyle(node).color;
                document.querySelectorAll('.stat-value').forEach(v => v.style.color = currentColor);
            }, 10);
        }

        // Jalur interaktif aksi klik penjelajah data (Menyelesaikan baris kode yang terpotong)
        node.addEventListener('click', () => {
            document.querySelectorAll('.competitor-node').forEach(n => n.classList.remove('active'));
            node.classList.add('active');

            document.getElementById('mdrValue').innerText = comp.mdr;
            document.getElementById('settlementValue').innerText = comp.speed;
            document.getElementById('shareValue').innerText = comp.share;
            
            // Sinkronisasi warna teks panel bawah dengan warna node yang aktif
            const currentColor = window.getComputedStyle(node).color;
            document.querySelectorAll('.stat-value').forEach(v => v.style.color = currentColor);
        });

        diagramArea.appendChild(node);
    });
</script>

</body>
</html>
